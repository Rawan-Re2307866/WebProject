<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR² Feed</title>
</head>

<body>
    <header class="header">
        <img src="images\logo.png" alt="a r squared" class="logo">
    </header>
    <main class="feed">
        <section class="post-container">

            <article class="post">
                <div class="post-header">
                    <div class="profile-pic"></div>
                    <h3 class="username">Username</h3>
                </div>

                <div class="post-content">
                    sample post content.
                </div>

                <div class="post-actions">
                    <button class="like-btn">
                        <img src="icons/heart.png" alt="Like">
                    </button>

                    <button class="comment-btn">
                        <img src="icons/comment.png" alt="Comment">
                    </button>
                </div>
                <div class="comments-container">

                    <div class="comment">
                        <div class="comment-pfp"></div>

                        <div class="comment-body">
                            <span class="comment-user">Razan</span>
                            <p class="comment-text">This is a comment</p>
                        </div>
                    </div>

                    <div class="comment-input">
                        <input type="text" placeholder="Write a comment...">
                        <button class="comment-post">
                            <img src="icons/submit-comment.png" alt="Post Comment">
                        </button>

                    </div>
                </div>

            </article>

        </section>

    </main>
</body>

</html>
