<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="styles/global.css">

</head>



<body class="post-body">

    <header class="top-bar">
        <img src="images\logo.png" alt="a r squared" class="logo">
    </header>


    <main class="post-page">


        <section class="content-part">

            <article id="post">

                <!-- User -->
                <div class="post-header">

                    <a href="profile.html">
                        <img src="images/prof1.png" alt="User profile picture" class="profile-pic">
                    </a>
                    <div class="post-user-info">
                        <a href="profile.html">
                            <h3 class="username">Username</h3>
                        </a>
                    </div>

                    <!-- Post Menu -->
                    <button class="menu-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-dots">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M7 12a2 2 0 1 1 -4 0q 0 -.053 .005 -.102a1.996 1.996 0 0 1 1.995 -1.898a2 2 0 0 1 2 2" />
                            <path
                                d="M14 12a2 2 0 1 1 -4 0q 0 -.053 .005 -.102a1.996 1.996 0 0 1 1.995 -1.898a2 2 0 0 1 2 2" />
                            <path
                                d="M21 12a2 2 0 1 1 -4 0q 0 -.053 .005 -.102a1.996 1.996 0 0 1 1.995 -1.898a2 2 0 0 1 2 2" />
                        </svg>
                    </button>

                </div>



                <div class="menu-bar">

                    <ul>
                        <li>
                            <button class="delete-post-btn">Delete Post</button>
                        </li>

                        <li>
                            <button class="edit-post-btn">Edit Post</button>
                        </li>
                    </ul>

                </div>


                <button class="menu-close-btn"></button>


                <!-- Post Content -->
                <div class="content">
                    <p>sample post content.</p>
                </div>

                <!-- Like and Comment Icons -->

                <div class="post-actions">
                    <button class="like-btn" aria-label="Like post">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-heart">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" />
                        </svg>
                    </button>
                    <span class="like-count">0</span>

                    <a href="post.html" class="comment-btn" aria-label="Open comments">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="#83778d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icon-tabler-bubble">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path
                                d="M12.4 3a5.34 5.34 0 0 1 4.906 3.239a5.333 5.333 0 0 1 -1.195 10.6a4.26 4.26 0 0 1 -5.28 1.863l-3.831 2.298v-3.134a2.668 2.668 0 0 1 -1.795 -3.773a4.8 4.8 0 0 1 2.908 -8.933a5.33 5.33 0 0 1 4.287 -2.16" />
                        </svg>
                    </a>
                </div>

            </article>

        </section>

        <section class="comments-part">

            <article id="post">


                <!-- Comments -->
                <div class="comments">
                    <h5>Comments</h5>
                </div>


                <!-- Display Comments -->
                <div class="display-comments">

                    <!-- Caption -->
                    <div class="post-caption">
                        <span class="caption-user"><strong>Username</strong></span>
                        <span class="caption-text">Another caption can go here.</span>
                    </div>

                    <div class="other-comments"></div>

                </div>

                <!-- Submit Comment -->
                <div class="submit-comment">
                    <form class="comment-here">
                        <input type="text" id="comment" name="comment" placeholder="comment here ...">
                        <button class="submit-comment-btn" type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="black" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-arrow-big-up-icon lucide-arrow-big-up">
                                <path
                                    d="M9 13a1 1 0 0 0-1-1H5.061a1 1 0 0 1-.75-1.811l6.836-6.835a1.207 1.207 0 0 1 1.707 0l6.835 6.835a1 1 0 0 1-.75 1.811H16a1 1 0 0 0-1 1v6a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z" />
                            </svg>
                        </button>
                    </form>
                </div>

            </article>

        </section>

    </main>

    <footer class="bottom-nav">
        <a href="feed.html" class="nav-item" aria-label="feed">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
    stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
    <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
    <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
    <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
</svg>
        </a>

        <a href="create-post.html" class="nav-item add" aria-label="Create post">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="white" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </a>

        <a href="profile.html" class="nav-item" aria-label="profile">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-user">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
                <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
            </svg>
        </a>
    </footer>

    <script type="module" src="scripts/storage.js"></script>
    
    <script type="module" src="scripts/post.js"></script>
    <script type="module" src="scripts/menudisplay.js"></script>
    
</body>

</html>
