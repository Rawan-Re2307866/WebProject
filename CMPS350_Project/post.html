<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/profile.css">

</head>
<script src="comment.js"></script>
<body style="background-color: var(--color-accent-soft);">
    <header>
        <a href="profile.html" style="color: var(--color-text-dark); text-decoration: none;">
            <img src="\images\prof1.png" alt="user" class="circle-img" width="10%">
             username
        </a>
    </header>
    <main>
        <section id="post">

        </section>

        <section id="display-comment">
            <h5 style="color: var(--color-text-dark);">Comments</h5>

            <div id="comments" style="max-height: 300px; overflow-y: auto;">


            </div>

        </section>

        <section id="submit-comment">
            <form id="comment-here">
                <input type="text" id="comment" name="comment" placeholder="comment here ..." style="border-radius: 3rem; border: none;">
                <button type="submit" style="border-radius: 3rem; width: 2rem; background:none; border:none;cursor:pointer;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-big-up-icon lucide-arrow-big-up">
                        <path d="M9 13a1 1 0 0 0-1-1H5.061a1 1 0 0 1-.75-1.811l6.836-6.835a1.207 1.207 0 0 1 1.707 0l6.835 6.835a1 1 0 0 1-.75 1.811H16a1 1 0 0 0-1 1v6a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/>
                    </svg>
                </button>
            </form>
        </section>
    </main>
    <footer>
        <table>
            <tr>
                <td>
                    <a href="">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M4 6l16 0" /><path d="M4 12l16 0" />
                            <path d="M4 18l16 0" />
                        </svg>
                    </a>
                </td>
                <td>
                    <a href="">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M12 5l0 14" />
                            <path d="M5 12l14 0" />
                        </svg>
                    </a>
                </td>
                <td>
                    <a href="feed.html">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-home">

                            <path d="M5 12l-2 0l9 -9l9 9l-2 0" />

                            <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
                        </svg> 
                    </a>
                </td>
        
            </tr>
        </table>    
    </footer>
    
</body>
</html>
