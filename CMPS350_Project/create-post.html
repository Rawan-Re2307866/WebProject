<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>
    <link rel="stylesheet" href="styles/global.css">
</head>

<body class="create-post-body">
   
    <header class="top-bar">
        <img src="images\logo.png" alt="a r squared" class="logo">
    </header>
   
    <main class="create-post-page">

        <!-- Create Post -->

            <div class="create-post-top-bar">

                <h3 class="create-post-header">Create Post</h3>

            </div>

            <section> 

                <article>

                    <div class="create-post-user">
                    
                        <a href="profile.html">
                            <img src="images/prof1.png" alt="User profile picture" class="user-pic">
                        </a>

                        <div class="create-post-user-info">
                            <a href="profile.html">
                                <h3 class="create-post-username">username</h3>
                            </a>
                        </div>

                    </div>
            
            
                    <div class="create-post-content">

                        <div class="create-caption-text">

                            <textarea name="caption-text" id="caption-text" cols="30" rows="5" placeholder="Type your post caption here..."></textarea>

                        </div>

        

                        <div class="post-type-selection-bar">
            
                            <button class="text-post-type">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-text-recognition">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                    <path d="M4 8v-2a2 2 0 0 1 2 -2h2" />
                                    <path d="M4 16v2a2 2 0 0 0 2 2h2" />
                                    <path d="M16 4h2a2 2 0 0 1 2 2v2" />
                                    <path d="M16 20h2a2 2 0 0 0 2 -2v-2" />
                                    <path d="M12 16v-7" />
                                    <path d="M9 9h6" />
                                </svg>
                            </button>

                            <button class="image-post-type">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-image-in-picture">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                    <path d="M13 15c-2 0 -5 1 -5 5" />
                                    <path d="M4 13a2 2 0 0 1 2 -2h5a2 2 0 0 1 2 2v5a2 2 0 0 1 -2 2h-5a2 2 0 0 1 -2 -2l0 -5" />
                                    <path d="M4 7v-2a1 1 0 0 1 1 -1h2" />
                                    <path d="M11 4h2" />
                                    <path d="M17 4h2a1 1 0 0 1 1 1v2" />
                                    <path d="M20 11v2" />
                                    <path d="M20 17v2a1 1 0 0 1 -1 1h-2" />
                                </svg>
                            </button>

                        </div>
                    </div>
                </article>

            <div class="text-image-content">

                <input type="file" id="media-content" accept="image/*">
                <input type="text" id="text-content" placeholder="Write your text here...">
                
            </div>
        </section>


        <div class="create-post-bottom-bar">

            <button class="post-content-btn"> post </button>

        </div>
        
        
   
    </main>

    <footer class="bottom-nav">
        <a href="feed.html" class="nav-item" aria-label="feed">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
                <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
                <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
            </svg>
        </a>

        
         <a href="create-post.html" class="nav-item add" aria-label="Create post">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="white" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </a>
       

        <a href="profile.html" class="nav-item" aria-label="profile">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
                <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
            </svg>
        </a>
        
    </footer>

    <script type="module" src="scripts/create-post.js"></script>
    
</body>
</html>
