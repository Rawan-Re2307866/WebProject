<!DOCTYPE html>

    <title>Profile</title>
    <link rel="stylesheet" href="styles/global.css">

<header class="profile-header">
<img src="images\logo.png" alt="a r squared" class="logo">
</header>
<main class="profile-card">

  <div class="profile-background"></div>

  <div class="profile-img-wrapper">
  <img src="images/prof1.png" alt="profile photo" class="profile-img">
</div>

  <div class="profile-content">

    <div class="profile-top-row">

      <h3 id="username">Username</h3>

      <div class="stats-and-btn">

        <div class="profile-stats">

          <div class="posts-number">
            <span class="count">6</span>
            <span class="label">Posts</span>
          </div>

          <div class="followers">
            <span class="count">10K</span>
            <span class="label">Followers</span>
          </div>

          <div class="following">
            <span class="count">256</span>
            <span class="label">Following</span>
          </div>

        </div>

        <button class="edit-btn">Edit Profile</button>

      </div>

    </div>

    <p class="bio">Write bio here....................</p>

  </div>
<section class="posts">

  <div class="post-profile"></div>
  <div class="post-profile"></div>
  <div class="post-profile"></div>

  <div class="post-profile"></div>
  <div class="post-profile"></div>
  <div class="post-profile"></div>
  
  <div class="post-profile"></div>
  <div class="post-profile"></div>
  <div class="post-profile"></div>

</section>
