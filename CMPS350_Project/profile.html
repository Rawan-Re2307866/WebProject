<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/profile.css">
</head>

<body class="profile-body">
  <header class="profile-header">
    <img src="images\logo.png" alt="a r squared" class="logo">
  </header>
  <main class="profile-card">

    <div class="profile-background"></div>

    <div class="profile-img-wrapper">
      <img src="images/prof1.png" alt="profile photo" class="profile-img">
    </div>

    <div class="profile-content">

      <div class="profile-top-row">

        <h3 class="profile-username">Username</h3>

        <div class="stats-and-btn">

          <div class="profile-stats">

            <div class="posts-number">
              <span class="count">6</span>
              <span class="label">Posts</span>
            </div>

            <div class="followers">
              <span class="count">10K</span>
              <span class="label">Followers</span>
            </div>

            <div class="following">
              <span class="count">256</span>
              <span class="label">Following</span>
            </div>

          </div>

          <button class="edit-btn">Edit Profile</button>

        </div>

      </div>

      <p class="bio">Write bio here....................</p>

    </div>
    <section class="posts">

      <div class="post-profile"></div>
      <div class="post-profile"></div>
      <div class="post-profile"></div>

      <div class="post-profile"></div>
      <div class="post-profile"></div>
      <div class="post-profile"></div>

      <div class="post-profile"></div>
      <div class="post-profile"></div>
      <div class="post-profile"></div>

    </section>
  </main>
  <footer>
    <nav class="bottom-nav">
      <a href="feed.html" class="nav-item" aria-label="Feed">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="white" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l9-9 9 9"></path>
                <path d="M9 21V9h6v12"></path>
            </svg>
      </a>

      <a href="create-post.html" class="nav-item add" aria-label="Create post">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="white" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </a>

      <a href="profile.html" class="nav-item" aria-label="profile">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
          <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
      </svg>
      </a>
    </nav>
  </footer>
</body>

</html>
