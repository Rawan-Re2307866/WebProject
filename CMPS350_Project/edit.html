<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
    <link rel="stylesheet" href="styles/global.css" />
  </head>
  <body class="edit-body">
    <header class="top-bar">
      <img src="images/logo.png" alt="AR squared logo" class="logo" />
    </header>
    <main class="edit">
      <h3>Edit Profile</h3>
      <div class="edit-container">
        <div class="avatar-section">
          <div class="avatar-wrapper" id="avatar-wrapper">
            <img src="images/prof1.png" alt="Profile photo" class="profile-img" id="preview-img" />
            <div class="avatar-overlay">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </div>
          </div>
          <input type="file" id="avatar-input" accept="image/*" />
          <span class="avatar-hint">Tap photo to change</span>
        </div>
 

        <div class="edit-form" id="edit-form">
 
          <div class="field-group">
            <label for="edit-username">Username</label>
            <input type="text" id="edit-username" placeholder="Enter username" />
            <span class="field-error" id="username-error"></span>
          </div>
 
          <div class="field-group">
            <label for="edit-bio">Bio</label>
            <textarea id="edit-bio" placeholder="Tell the world about yourself…"></textarea>
          </div>
 
          <hr class="divider" />
 

          <div class="password-toggle-row" id="password-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
            Change Password
          </div>
 
          <div class="password-fields" id="password-fields">
 
            <div class="field-group">
              <label for="current-password">Current Password</label>
              <input type="password" id="current-password" placeholder="Enter current password" />
              <span class="field-error" id="current-password-error"></span>
            </div>
 
            <div class="field-group">
              <label for="new-password">New Password</label>
              <input type="password" id="new-password" placeholder="8+ chars, upper, lower, digit, special" />
              <span class="field-error" id="new-password-error"></span>
            </div>
 
            <div class="field-group">
              <label for="confirm-new-password">Confirm New Password</label>
              <input type="password" id="confirm-new-password" placeholder="Repeat new password" />
              <span class="field-error" id="confirm-password-error"></span>
            </div>
 
          </div>
 
          <!-- Action buttons -->
          <div class="btn-row">
            <a href="profile.html" class="cancel-btn">Cancel</a>
            <button class="save-btn" id="save-btn">Save Changes</button>
          </div>
 
        </div>
      </div>
    </main>
 
    <div class="toast" id="toast">Profile updated!</div>
 
    <footer class="bottom-nav">
      <a href="feed.html" class="nav-item" aria-label="feed">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
    stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
    <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
    <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
    <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
</svg>
      </a>

      <a href="create-post.html" class="nav-item add" aria-label="Create post">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          fill="none"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </a>

      <a href="profile.html" class="nav-item" aria-label="profile">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-user"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
          <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
        </svg>
      </a>
    </footer>
    <script src="scripts/storage.js"></script>
<script src="scripts/edit.js"></script>
  </body>
</html>
