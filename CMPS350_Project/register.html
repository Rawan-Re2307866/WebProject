<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/global.css">
</head>
<body class="register-body">
    <header class="register-header top-bar">
        <img src="images/logo.png" alt="AR squared logo" class="logo">
    </header>
    <main class="register-main">
        <h2>Create an Account</h2>
        <form class="register-form" id="register-form">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" name="register-email" placeholder="Enter email" required/>
                <span id="register-emailError"></span>
                <label for="register-username">Username</label>
                <input type="text" id="register-username" name="register-username" placeholder="enter username" required />
                <span id="register-usernameError"></span>
                <label for="register-password">Password</label>
                <input type="password" id="register-password" name="register-password" placeholder="enter password" required />
                <span id="register-passwordError"></span>
                <label for="check-password">Confirm Password</label>
                <input type="password" id="check-password" name="check-password" placeholder="enter password again" required />
                <span id ="check-passwordError"></span>
                <button type="submit" class="register-btn">Sign up</button>

                <div class="signup">
                    <p>Already have an account?</p>
                    <a href="login.html">Log in</a>
                </div>

        </form>

    </main>
    <footer class="register-footer">

    </footer>
    <script type="module" src="scripts/register.js"></script>
    
</body>
</html>
